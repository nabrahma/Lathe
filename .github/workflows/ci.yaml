name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  CGO_ENABLED: "0"

jobs:
  static:
    name: static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^frontend/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - name: import boundaries (wails + network)
        run: go run ./scripts/boundary
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...
      - run: go test ./...
      - name: race detector
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: no HTML file inputs, no <video>, no CDN fonts in bundle
        run: node scripts/check-bundle.mjs
        working-directory: frontend

  desktop-build:
    name: desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: wails doctor
        run: wails doctor || true
      - run: wails build -trimpath -skipbindings
        env:
          CGO_ENABLED: "1"
      - name: installer size budget
        shell: bash
        run: bash scripts/size-budget.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lathe-${{ matrix.os }}
          path: build/bin/*
          if-no-files-found: warn

  linux-distros:
    name: linux build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, fedora:41, archlinux:latest]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        shell: bash
        run: bash scripts/linux-deps.sh
      - name: build core
        shell: bash
        run: go build ./... && go test ./internal/...
