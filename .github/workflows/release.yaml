name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.25"
  WAILS_VERSION: "v2.15.0"

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: lathe-windows-amd64
          - os: macos-latest
            artifact: lathe-macos-universal
          - os: ubuntu-latest
            artifact: lathe-linux-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so git describe produces a real version

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          # Wails v2 links against webkit2gtk-4.0 unless this tag is set, and
          # Ubuntu 24.04 onwards ships only 4.1.
          tags=""
          [ "$RUNNER_OS" = Linux ] && tags="-tags webkit2_41"
          wails build -trimpath $tags -ldflags \
            "-s -w -X github.com/nabrahma/lathe/internal/version.Version=${{ steps.version.outputs.value }}"

      - name: build the headless binary
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags \
            "-s -w -X github.com/nabrahma/lathe/internal/version.Version=${{ steps.version.outputs.value }}" \
            -o "build/bin/lathe-cli$([ "$RUNNER_OS" = Windows ] && echo .exe)" ./cmd/lathe-cli

      - name: installer size budget
        shell: bash
        run: bash scripts/size-budget.sh

      # macOS is the one platform where an unsigned app is genuinely hard to
      # open, so it is signed and notarised when credentials are configured.
      # Without them the build still succeeds and ships unsigned, with the
      # README explaining what the user will see.
      - name: sign and notarize (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_USER: ${{ secrets.MACOS_NOTARY_USER }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: bash scripts/sign-macos.sh

      - name: package
        shell: bash
        run: bash scripts/package.sh "${{ matrix.artifact }}" "${{ steps.version.outputs.value }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: collect and checksum
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          # One checksum file, so a user can verify what they downloaded.
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: software bill of materials
        env:
          # cyclonedx-gomod targets a newer Go than this repository does, so it
          # is allowed to fetch its own toolchain.
          GOTOOLCHAIN: auto
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          # go install writes to GOPATH/bin, which is not on PATH here.
          "$(go env GOPATH)/bin/cyclonedx-gomod" mod -json -output dist/sbom.json

      # The release page says what changed in the words the changelog uses,
      # rather than a list of commit subjects. Failing when the section is
      # missing is deliberate: a release whose body is empty is worse than a
      # build that stops and says the changelog was never updated.
      - name: release notes from the changelog
        env:
          # Empty unless a tag triggered this run, which is how the manual
          # workflow_dispatch path is told to fall back to the newest section.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
          else
            version=$(awk '/^## [0-9]/ { sub(/^## /, ""); print; exit }' CHANGELOG.md)
            echo "not a tag build, using the newest changelog section: $version"
          fi

          awk -v want="## $version" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          draft: false
