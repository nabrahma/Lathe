<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 64" width="232" height="64" role="img" aria-label="Lathe">
  <title>Lathe</title>
  <!-- Machine black tile, so the mark reads the same on a light or a dark page. -->
  <rect width="232" height="64" fill="#080808"/>

  <!-- Corner registration ticks, the same marks the interface uses. -->
  <g stroke="#3d3d3d" stroke-width="1.5" fill="none">
    <path d="M3 8V3h5M224 3h5v5M229 56v5h-5M8 61H3v-5"/>
  </g>

  <!-- The workpiece seen end on, its face broken where the tool has cut. -->
  <circle cx="29" cy="32" r="22" fill="none" stroke="#ededed" stroke-width="4"
          stroke-dasharray="128.247 9.983" transform="rotate(13 29 32)"/>
  <circle cx="29" cy="32" r="5.5" fill="#ededed"/>

  <!-- The tool: a straight shank ground to a point, sitting in the cut. -->
  <path d="M47 32 56 27.5H64v9h-8Z" fill="#ffe500"/>

  <text x="86" y="41"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace"
        font-size="26" font-weight="400" letter-spacing="7" fill="#ededed">LATHE</text>
</svg>
